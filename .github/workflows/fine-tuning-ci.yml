name: fine-tuning-pipeline-ci

on:
  push:
    paths:
      - "ai-engineering-lab/fine-tuning/**"
      - ".github/workflows/fine-tuning-ci.yml"
  pull_request:
    paths:
      - "ai-engineering-lab/fine-tuning/**"
      - ".github/workflows/fine-tuning-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engineering-lab/fine-tuning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
