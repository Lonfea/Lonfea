name: model-router-ci

on:
  push:
    paths:
      - "ai-engineering-lab/model-router/**"
      - ".github/workflows/model-router-ci.yml"
  pull_request:
    paths:
      - "ai-engineering-lab/model-router/**"
      - ".github/workflows/model-router-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engineering-lab/model-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
